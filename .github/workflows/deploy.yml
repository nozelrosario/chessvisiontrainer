name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-prod:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nozelrosario.github.io/chessvisiontrainer/
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build for production
        run: |
          mkdir -p build
          ls -la
          echo "Contents of current directory:"
          find . -maxdepth 1 -type f -not -path '*/\.*' -not -name '.git*'
          find . -maxdepth 1 -type f -not -path '*/\.*' -not -name '.git*' -exec cp {} build/ \;
          find . -maxdepth 1 -type d -not -name 'build' -not -name '.git' -not -name '.' | while read dir; do cp -r "$dir" build/; done
          echo "Build directory contents:"
          ls -la build/

      - name: Deploy to production
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          keep_files: true

      - name: Deployment summary
        run: echo "[SUCCESS] Production deployed to https://nozelrosario.github.io/chessvisiontrainer/"

  deploy-uat:
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment:
      name: uat
      url: https://nozelrosario.github.io/chessvisiontrainer/develop/
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build for UAT
        run: |
          mkdir -p build/develop
          ls -la
          echo "Contents of current directory:"
          find . -maxdepth 1 -type f -not -path '*/\.*' -not -name '.git*'
          find . -maxdepth 1 -type f -not -path '*/\.*' -not -name '.git*' -exec cp {} build/develop/ \;
          find . -maxdepth 1 -type d -not -name 'build' -not -name '.git' -not -name '.' | while read dir; do cp -r "$dir" build/develop/; done
          echo "Build directory contents:"
          ls -la build/

      - name: Deploy to UAT
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          keep_files: true

      - name: Deployment summary
        run: echo "[SUCCESS] UAT deployed to https://nozelrosario.github.io/chessvisiontrainer/develop/"
