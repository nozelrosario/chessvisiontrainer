name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for main branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages (Production)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployment info
        run: |
          echo "✅ Production deployed to: https://nozelrosario.github.io/chessvisiontrainer/"

  deploy-uat:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create develop directory structure
        run: |
          mkdir -p build/develop
          # Copy only files and directories, excluding build/ and .git
          find . -maxdepth 1 -type f -exec cp {} build/develop/ \;
          find . -maxdepth 1 -type d ! -name build ! -name .git ! -name . -exec cp -r {} build/develop/ \;

      - name: Upload artifact for develop branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

      - name: Deploy to GitHub Pages (UAT)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployment info
        run: |
          echo "✅ UAT deployed to: https://nozelrosario.github.io/chessvisiontrainer/develop/"