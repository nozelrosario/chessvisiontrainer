name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build artifact for main branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp -r . _site/
          rm -rf _site/_site .git _site/.git

      - name: Build artifact for develop branch
        if: github.ref == 'refs/heads/develop'
        run: |
          mkdir -p _site/develop
          # Copy all files to develop subdirectory
          find . -maxdepth 1 -type f ! -name '.*' -exec cp {} _site/develop/ \;
          find . -maxdepth 1 -type d ! -name '_site' ! -name '.git' ! -name '.' -exec cp -r {} _site/develop/ \;

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployment info
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "✅ Production deployed to: https://nozelrosario.github.io/chessvisiontrainer/"
          else
            echo "✅ UAT deployed to: https://nozelrosario.github.io/chessvisiontrainer/develop/"
          fi