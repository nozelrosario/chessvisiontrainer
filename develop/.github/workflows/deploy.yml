name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Debug - Print branch info
        run: |
          echo "github.ref: ${{ github.ref }}"
          echo "github.ref_name: ${{ github.ref_name }}"
          echo "github.event_name: ${{ github.event_name }}"

      - name: Build artifact for main branch
        if: github.ref_name == 'main'
        run: |
          mkdir -p build
          # Copy all files except build and .git
          find . -maxdepth 1 -type f ! -name '.*' -exec cp {} build/ \;
          find . -maxdepth 1 -type d ! -name 'build' ! -name '.git' ! -name '.' -exec cp -r {} build/ \;
          echo "✅ Built for main branch"
          
      - name: Build artifact for develop branch
        if: github.ref_name == 'develop'
        run: |
          mkdir -p build/develop
          # Copy all files to develop subdirectory
          find . -maxdepth 1 -type f ! -name '.*' -exec cp {} build/develop/ \;
          find . -maxdepth 1 -type d ! -name 'build' ! -name '.git' ! -name '.' -exec cp -r {} build/develop/ \;
          echo "✅ Built for develop branch"

      - name: Deploy main to gh-pages root
        if: github.ref_name == 'main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          keep_files: true

      - name: Deploy develop to gh-pages develop folder
        if: github.ref_name == 'develop' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          keep_files: true

      - name: Print deployment info
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "✅ Production deployed to: https://nozelrosario.github.io/chessvisiontrainer/"
          elif [ "${{ github.ref_name }}" == "develop" ]; then
            echo "✅ UAT deployed to: https://nozelrosario.github.io/chessvisiontrainer/develop/"
          fi